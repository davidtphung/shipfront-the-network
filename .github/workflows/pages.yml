name: Publish to gh-pages

# GitHub Pages serves this site from the gh-pages branch. This job makes sure
# the capability stills are present and byte correct, then keeps gh-pages in
# sync with main so a push to main publishes the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify or fetch capability stills
        id: stills
        run: bash scripts/fetch-stills.sh

      - name: Commit any newly fetched stills
        if: steps.stills.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          git commit -m "Add verified capability stills"
          git push origin HEAD:main

      - name: Mirror main onto gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/gh-pages --force
